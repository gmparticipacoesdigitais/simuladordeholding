<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - IRPF</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-pattern"></div>

    <div class="container">
        <div class="login-card">
            <div class="card-header">
                <h1>Criar Conta</h1>
                <p class="subtitle">Preencha seus dados para começar</p>
            </div>

            <form class="login-form" id="register-form">
                <div class="input-group">
                    <label class="input-label">Nome Completo</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input name="nome" placeholder="Seu nome completo" type="text" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">E-mail</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input name="email" placeholder="seu@email.com" type="email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Senha</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input name="senha" placeholder="Mínimo 6 caracteres" type="password" required minlength="6">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Confirmar Senha</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input name="confirmar-senha" placeholder="Digite a senha novamente" type="password" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <span>Criar Conta</span>
                </button>

                <div class="divider">
                    <span>ou</span>
                </div>

                <button type="button" class="btn-google" id="google-register-btn">
                    Cadastrar com Google
                </button>
            </form>

            <div class="card-footer">
                <p>Já possui uma conta? <a href="index.html" class="signup-link">Fazer login</a></p>
            </div>
        </div>

        <div class="security-badge">
            <i class="fas fa-lock"></i>
            <span>Seus dados estão seguros</span>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Firebase Config -->
    <script src="firebase-config.js"></script>

    <!-- Auth Script -->
    <script src="auth.js"></script>
</body>
</html>
