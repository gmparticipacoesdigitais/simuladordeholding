# Schema para Sistema de Login IRPF
# Sistema de autenticação, pagamento e cálculos de imposto de renda

# Tabela de usuários - keyed por Firebase Auth UID
type User @table {
  # @default(expr: "auth.uid") configura automaticamente com o UID do Firebase Auth
  id: String! @default(expr: "auth.uid")
  email: String! @col(dataType: "varchar(255)")
  displayName: String @col(dataType: "varchar(255)")
  provider: String @col(dataType: "varchar(50)") # 'email' ou 'google'
  hasPaid: Boolean! @default(value: false)
  stripeCustomerId: String @col(dataType: "varchar(255)")
  createdAt: Timestamp! @default(expr: "request.time")
  lastLogin: Timestamp
  updatedAt: Timestamp
}

# Tabela de pagamentos
type Payment @table {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  stripeSessionId: String @col(dataType: "varchar(255)")
  stripePaymentIntentId: String @col(dataType: "varchar(255)")
  amount: Int! # valor em centavos
  currency: String! @col(dataType: "varchar(10)") @default(value: "brl")
  status: String! @col(dataType: "varchar(50)") # 'pending', 'completed', 'failed', 'refunded'
  paymentMethod: String @col(dataType: "varchar(50)")
  createdAt: Timestamp! @default(expr: "request.time")
  completedAt: Timestamp
}

# Tabela de cálculos de IRPF
type Calculation @table {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  rendaBruta: Float!
  dependentes: Int! @default(value: 0)
  pensaoAlimenticia: Float! @default(value: 0)
  despesasMedicas: Float! @default(value: 0)
  despesasEducacao: Float! @default(value: 0)
  previdenciaPrivada: Float! @default(value: 0)
  inss: Float!
  baseCalculo: Float!
  impostoDevido: Float!
  metodo: String! @col(dataType: "varchar(50)") # 'Deduções Legais' ou 'Desconto Simplificado'
  totalDeducoes: Float!
  createdAt: Timestamp! @default(expr: "request.time")
  isLatest: Boolean! @default(value: false)
}

# Tabela de auditoria/logs
type AuditLog @table {
  id: UUID! @default(expr: "uuidV4()")
  user: User
  action: String! @col(dataType: "varchar(100)")
  details: String @col(dataType: "text")
  ipAddress: String @col(dataType: "varchar(50)")
  userAgent: String @col(dataType: "varchar(500)")
  createdAt: Timestamp! @default(expr: "request.time")
}
