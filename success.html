<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagamento Confirmado - IRPF</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out;
        }
        .success-icon i {
            color: white;
            font-size: 40px;
        }
        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .countdown {
            color: #818cf8;
            font-weight: 600;
            font-size: 18px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>

    <div class="container">
        <div class="login-card">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>

            <div class="card-header">
                <h1>Pagamento Confirmado!</h1>
                <p class="subtitle">Sua assinatura foi ativada com sucesso</p>
            </div>

            <div style="text-align: center; color: #cbd5e1; margin-bottom: 32px;">
                <p style="margin-bottom: 16px;">Obrigado por assinar! Você já tem acesso completo ao estimador de IRPF.</p>
                <p class="countdown">Redirecionando em <span id="countdown">3</span> segundos...</p>
            </div>

            <button class="btn-primary" onclick="window.location.href='app.html'">
                <span>Acessar Aplicação Agora</span>
            </button>

            <div class="security-badge" style="margin-top: 24px;">
                <i class="fas fa-check-circle"></i>
                <span>Assinatura ativa</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Firebase Config -->
    <script src="firebase-config.js"></script>

    <script>
        // Inicializar Firebase
        let auth, db;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(window.FIREBASE_CONFIG);
            }
            auth = firebase.auth();
            db = firebase.firestore();
            console.log('✅ Firebase inicializado na página de sucesso');
        } catch (error) {
            console.error('❌ Erro ao inicializar Firebase:', error);
        }

        // Pegar parâmetros da URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        const uid = urlParams.get('uid');

        console.log('Session ID:', sessionId);
        console.log('UID:', uid);

        // Marcar pagamento como concluído no Firestore
        async function markPaymentComplete() {
            const user = auth.currentUser;
            const userId = uid || (user ? user.uid : null);

            if (!userId) {
                console.error('❌ Usuário não identificado');
                return;
            }

            try {
                console.log('✅ Marcando pagamento como concluído para usuário:', userId);

                await db.collection('users').doc(userId).set({
                    hasPaid: true,
                    stripeSessionId: sessionId || 'manual',
                    paidAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    pendingPayment: false
                }, { merge: true });

                console.log('✅ Pagamento marcado como concluído no Firestore!');
            } catch (error) {
                console.error('❌ Erro ao atualizar Firestore:', error);
            }
        }

        // Executar quando autenticado
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await markPaymentComplete();
            }
        });

        // Countdown para redirecionamento
        let countdown = 3;
        const countdownElement = document.getElementById('countdown');

        const interval = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;

            if (countdown === 0) {
                clearInterval(interval);
                window.location.href = 'app.html';
            }
        }, 1000);
    </script>
</body>
</html>
