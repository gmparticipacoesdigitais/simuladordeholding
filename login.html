<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Baking with the Gemini API</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <main>
    <h1>Login</h1>
    <form action="https://irpf.auditoriaemfoco.com/">
      <div class="prompt-box">
        <label>
          <input name="e-mail" placeholder="Username" type="text">
        </label>
      </div>
      <div class="prompt-box">
        <label>
          <input name="senha" placeholder="Password" type="password">
        </label>
      </div>
      <div class="prompt-box">
        <button type="submit">Login</button>
      </div>
    </form>
    <p>Don't have an account? <a href="https://irpf.auditoriaemfoco.com/">Register here</a></p>
  </main>

  <script type="module" src="/main.js"></script>
</body>

</html>
