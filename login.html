<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Simulador Holding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-light: #e0f2fe;
            --primary: #38bdf8;
            --primary-dark: #0ea5e9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --surface: #ffffff;
            --border: #e2e8f0;
            --danger: #ef4444;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.1), 0 4px 6px -2px rgba(15, 23, 42, 0.05);
            --font-family: 'Inter', sans-serif;
            --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            color: var(--text-primary);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            text-align: left;
        }

        .label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
        }

        .input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            background: #f8fafc;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all var(--transition-base);
            box-sizing: border-box;
        }

        .input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .btn {
            padding: 1rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition-base);
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
        }

        .loader {
            width: 18px;
            height: 18px;
            border: 2px solid #FFF;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #error-message {
            color: var(--danger);
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: var(--radius-md);
            padding: 0.875rem;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">
                <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
            </div>
            <span class="logo-text">Simulador Holding</span>
        </div>
        <h2>Acesse sua conta</h2>
        <p>Bem-vindo! Insira suas credenciais para continuar.</p>

        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="email" class="label">Email</label>
                <input type="email" id="email" class="input" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="password" class="label">Senha</label>
                <input type="password" id="password" class="input" placeholder="••••••••" required>
            </div>
            <button type="submit" id="login-button" class="btn">
                <span id="button-text">Entrar</span>
                <div id="loader" class="loader" style="display: none;"></div>
            </button>
        </form>

        <div id="error-message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const loginButton = document.getElementById('login-button');
            const buttonText = document.getElementById('button-text');
            const loader = document.getElementById('loader');
            const errorMessageDiv = document.getElementById('error-message');

            // Redirect if already logged in
            if (localStorage.getItem('authToken')) {
                window.location.href = 'index.html';
            }

            loginForm.addEventListener('submit', async (event) => {
                event.preventDefault();

                // --- UI Start Loading State ---
                loginButton.disabled = true;
                buttonText.textContent = 'Entrando...';
                loader.style.display = 'block';
                errorMessageDiv.style.display = 'none';
                errorMessageDiv.textContent = '';

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const xanoApiUrl = 'https://xsvy-gcem-ukz0.n7e.xano.io/api:8PvLDGDX/auth/login';

                try {
                    const response = await fetch(xanoApiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password,
                        }),
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        // Use the message from Xano's response, or a default one
                        throw new Error(data.message || 'Credenciais inválidas. Por favor, tente novamente.');
                    }

                    // --- Success ---
                    if (data.authToken) {
                        localStorage.setItem('authToken', data.authToken);
                        window.location.href = 'index.html'; // Redirect to the main app
                    } else {
                        throw new Error('Token de autenticação não recebido.');
                    }

                } catch (error) {
                    // --- Error Handling ---
                    errorMessageDiv.textContent = error.message;
                    errorMessageDiv.style.display = 'block';
                } finally {
                    // --- UI Reset State ---
                    loginButton.disabled = false;
                    buttonText.textContent = 'Entrar';
                    loader.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
