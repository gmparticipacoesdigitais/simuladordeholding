<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - IRPF</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-pattern"></div>

    <div class="container">
        <div class="login-card">
            <div class="card-header">
                <h1>Bem-vindo</h1>
                <p class="subtitle">Acesse sua conta para continuar</p>
            </div>

            <form class="login-form" id="email-login-form">
                <div class="input-group">
                    <label class="input-label">E-mail</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input name="e-mail" placeholder="seu@email.com" type="email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Senha</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input name="senha" placeholder="••••••••" type="password" required id="password-input">
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember">
                        <span class="checkmark"></span>
                        <span class="checkbox-label">Manter conectado</span>
                    </label>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-primary">
                    <span>Entrar</span>
                </button>

                <div class="divider">
                    <span>ou</span>
                </div>

                <button type="button" class="btn-google" id="google-login-btn">
                    Continuar com Google
                </button>
            </form>

            <div class="card-footer">
                <p>Não possui uma conta? <a href="register.html" class="signup-link">Criar conta</a></p>
            </div>
        </div>

        <div class="security-badge">
            <i class="fas fa-lock"></i>
            <span>Seus dados estão seguros</span>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Firebase Config -->
    <script src="firebase-config.js"></script>

    <!-- Auth Script -->
    <script src="auth.js"></script>
</body>
</html>
