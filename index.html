<style>
  :root {
    /* Design System - Light Theme (Improved) */
    --color-primary: #3B82F6;          /* A professional and trustworthy blue (Tailwind Blue 500) */
    --color-primary-hover: #2563EB;    /* A darker shade for hover states (Tailwind Blue 600) */
    --color-background: #F9FAFB;      /* A very light gray for the page background (Tailwind Gray 50) */
    --color-surface-elevated: #FFFFFF;/* Pure white for cards and elevated surfaces */
    --color-border: #E5E7EB;          /* A subtle gray for borders (Tailwind Gray 200) */
    --color-text-primary: #111827;    /* A dark gray for high-contrast text (Tailwind Gray 900) */
    --color-text-secondary: #6B7280;  /* A lighter gray for secondary text (Tailwind Gray 500) */
    --radius-lg: 12px;
    --radius-xl: 16px;
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  }

  [data-theme="dark"] {
    /* Dark theme remains the same, but you could adjust it to match the new blue primary color */
    --color-primary: #60A5FA; /* Lighter blue for dark mode */
    --color-primary-hover: #3B82F6;
    --color-background: #0B0F1A;
    --color-surface-elevated: #1F2937;
    --color-border: #374151;
    --color-text-primary: #F9FAFB;
    --color-text-secondary: #D1D5DB;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--color-background);
    color: var(--color-text-primary);
    line-height: 1.6;
  }

  .card {
    background: var(--color-surface-elevated);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    box-shadow: var(--shadow-sm); /* Using Tailwind's shadow-sm for subtlety */
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: var(--color-primary);
    color: white;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--color-primary-hover);
  }
  
  .btn-secondary {
    background-color: #E5E7EB; /* Light gray */
    color: #374151; /* Darker gray text */
  }

  .btn-secondary:hover:not(:disabled) {
      background-color: #D1D5DB;
  }

  .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
  }

  .input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    background: var(--color-surface-elevated);
    color: var(--color-text-primary);
  }

  [data-theme="dark"] .input {
      background-color: var(--color-background);
  }

  .input:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); /* Adjusted focus ring to match new blue */
  }

  /* Chart containers */
  .chart-container {
    position: relative;
    height: 300px;
    width: 100%;
  }

  /* Login styles */
  .login-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #60A5FA 0%, #3B82F6 100%); /* Adjusted gradient */
  }

  .login-card {
    background: white;
    border-radius: var(--radius-xl);
    padding: 2rem;
    box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    width: 100%;
    max-width: 400px;
  }

  .hidden {
    display: none !important;
  }

  #save-status {
      transition: opacity 0.5s ease;
  }
</style>
